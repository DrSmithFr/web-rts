<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rts</title>
    <script src="/wasm_exec.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #10131a;
        color: #d7dce6;
      }
      #gl {
        position: fixed;
        inset: 0;
        display: block;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        background: rgba(10, 12, 18, 0.8);
        border: 1px solid #2c3345;
        border-radius: 6px;
        font-size: 14px;
        line-height: 1.5;
        user-select: none;
      }
      #hud .dim {
        color: #8a93a6;
      }
      #hover {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 6px 10px;
        background: rgba(10, 12, 18, 0.8);
        border: 1px solid #2c3345;
        border-radius: 6px;
        font-size: 13px;
        visibility: hidden;
        user-select: none;
      }
      #selrect {
        position: fixed;
        border: 1px solid #ffffff;
        background: rgba(255, 255, 255, 0.12);
        display: none;
        pointer-events: none;
      }
      #resbar {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(10, 12, 18, 0.8);
        border: 1px solid #2c3345;
        border-radius: 6px;
        font-size: 14px;
        display: none;
        gap: 18px;
        user-select: none;
      }
      #resbar .k {
        color: #8a93a6;
      }
      #panel {
        position: fixed;
        bottom: 12px;
        right: 12px;
        min-width: 220px;
        padding: 10px 14px;
        background: rgba(10, 12, 18, 0.85);
        border: 1px solid #2c3345;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.5;
        display: none;
        user-select: none;
      }
      #panel .dim {
        color: #8a93a6;
      }
      #panel .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      #panel button {
        font: inherit;
        color: #d7dce6;
        background: #1d2433;
        border: 1px solid #38425a;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #panel button:hover {
        background: #29334a;
      }
      #panel button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #minimapbox {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(10, 12, 18, 0.85);
        border: 1px solid #2c3345;
        border-radius: 6px;
        padding: 4px;
        display: none;
        line-height: 0;
        user-select: none;
      }
      #minimap {
        border-radius: 4px;
        cursor: crosshair;
      }
      #victory {
        position: fixed;
        top: 42%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 18px 34px;
        background: rgba(10, 12, 18, 0.92);
        border: 1px solid #caa84f;
        border-radius: 8px;
        font-size: 22px;
        color: #f2e3b0;
        display: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="hud">
      <div id="status" class="dim">initializing</div>
      <div id="stats" hidden>
        <div><span class="dim">tick</span> <span id="tick">0</span></div>
        <div><span class="dim">hash</span> <span id="hash">0000000000000000</span></div>
        <div><span class="dim">map</span> <span id="map">—</span></div>
        <div><span class="dim">fps</span> <span id="fps">0</span></div>
        <div><span class="dim">selected</span> <span id="selected">0</span></div>
      </div>
    </div>
    <div id="hover"></div>
    <div id="selrect"></div>
    <div id="resbar">
      <span><span class="k">W</span> <span id="res-wood">0</span></span>
      <span><span class="k">S</span> <span id="res-stone">0</span></span>
      <span><span class="k">F</span> <span id="res-food">0</span></span>
      <span><span class="k">G</span> <span id="res-gold">0</span></span>
      <span><span class="k">pop</span> <span id="res-pop">0/0</span></span>
      <span><span class="k">era</span> <span id="res-era">—</span></span>
      <span><span class="k">relics</span> <span id="res-relics">0</span></span>
    </div>
    <div id="panel"></div>
    <div id="victory"></div>
    <div id="minimapbox">
      <canvas id="minimap" width="168" height="168"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
